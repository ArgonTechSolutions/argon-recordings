# Copy to recordings.toml. Paths are relative to the configuration file.
[app]
port = 8787
max_upload_mb = 256 # MiB per file; use e.g. 2048 for 2 GiB uploads.
name = "argon-recordings"

[models]
transcription = "turbo"
embedding = "large" # large (recommended), base, small, or off
# Optional: reuse the prepared Philemon benchmark model instead of downloading it.
# turbo_path = "/path/to/benchmark/data/models/large-v3-turbo"

[resources]
cpus = 2
memory_gib = 6
job_timeout_seconds = 0 # No job deadline; optional positive value for an operator timeout.

[docker]
sudo = false # Set true for sudo -n docker; first authenticate with sudo -v.
